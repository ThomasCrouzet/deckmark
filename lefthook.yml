# Install local Git hooks with `npm run prepare`, which calls lefthook install.
# External contributors must opt in. Do not silently block their work.

pre-commit:
  # Prettier and ESLint can modify the same staged file. Run them in order.
  parallel: false
  commands:
    repository-policy:
      run: 'policy_check="${REPOSITORY_POLICY_CHECK:-$HOME/.config/git/repository-policy/policy-check.sh}"; [ ! -x "$policy_check" ] || "$policy_check" staged'
    prettier:
      glob: '*.{ts,js,svelte,css,md,json,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,js,svelte}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true

# Before push, check types and the tests that the pushed change can affect.
# CI runs the full suite on every pull request, and the batch checklist runs
# one full `npm test` before the batch push.
pre-push:
  parallel: false
  commands:
    repository-policy:
      run: 'policy_check="${REPOSITORY_POLICY_CHECK:-$HOME/.config/git/repository-policy/policy-check.sh}"; [ ! -x "$policy_check" ] || "$policy_check" push'
      use_stdin: true
    typecheck:
      run: npm run check
    # Vitest for the modules that changed since origin/main, with their
    # dependents.
    unit-changed:
      run: npx vitest run --changed origin/main --passWithNoTests
    # The CI contract tests and the scheduler check run only when a script,
    # workflow, native or package file changed since origin/main.
    ci-contracts:
      files: git diff --name-only origin/main...HEAD
      glob:
        - 'scripts/**'
        - '.github/**'
        - 'src-tauri/**'
        - 'package.json'
        - 'package-lock.json'
      run: npm run test:ci && node scripts/verify-desktop-backup-scheduler.mjs
