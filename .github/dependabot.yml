version: 2
# Version proposals go to the deps-staging branch. The validation workflows
# run only for pull requests to main, so a proposal starts no CI (only the
# 10 s gitleaks scan). The maintainer folds the proposals into the next batch
# pull request, which validates the combined lockfile, and closes them as
# superseded. Nothing merges automatically.
#
# Security updates always target main and run the normal pull request checks.
# Options in these entries (labels, commit messages, groups) do not apply to
# them, because target-branch is set.
#
# The cooldown delays a new version for version updates only. Security
# updates ignore it. deps-staging must exist before this file lands.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: deps-staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: 'build(deps)'
    # One weekly pull request for patch and minor updates, and one for
    # Milkdown, which has a history of breaking minor releases.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@milkdown/*'
      milkdown:
        patterns:
          - '@milkdown/*'
    # Major upgrades remain visible as separate pull requests for manual review.
    # A previous major-version ignore hid them entirely.
    ignore:
      # js-yaml 5 removes DEFAULT_SCHEMA, which frontmatter.ts uses.
      # Keep js-yaml 4.x while the current parser and its error recovery meet requirements.
      - dependency-name: 'js-yaml'
        update-types:
          - 'version-update:semver-major'
      # Current stack: Vitest 4, ESLint 10, TypeScript 6, jsdom 26.
      # Ignore the next majors until a dedicated migration PR.
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitest/coverage-v8'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'jsdom'
        update-types:
          - 'version-update:semver-major'
      # Playwright 1.63.0 ships Chromium 153. The browser stops with a crash
      # when the app restores a disk handle after a reload. Keep 1.62.1 until
      # the browser fix is available.
      - dependency-name: '@playwright/test'
        versions:
          - '1.63.0'
      # axe-core 4.14.0 requires visible shortcut and index text in the
      # accessible name of several controls. The browser a11y gate needs a
      # dedicated label review before this update.
      - dependency-name: '@axe-core/playwright'
        versions:
          - '4.14.0'

  - package-ecosystem: github-actions
    directory: /
    target-branch: deps-staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: deps-staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: 'build(deps)'
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
