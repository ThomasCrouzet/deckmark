version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    labels:
      - dependencies
    # Open one weekly pull request for patch and minor updates, except packages
    # that require dedicated review because of prior compatibility breaks.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
        # Milkdown has a history of breaking minor releases and needs manual review.
        exclude-patterns:
          - '@milkdown/*'
    # Major upgrades remain visible as separate pull requests for manual review.
    # A previous major-version ignore hid them entirely.
    ignore:
      # js-yaml 5 removes DEFAULT_SCHEMA, which frontmatter.ts uses.
      # Keep js-yaml 4.x while the current parser and its error recovery meet requirements.
      - dependency-name: 'js-yaml'
        update-types:
          - 'version-update:semver-major'
      # Current stack: Vitest 4, ESLint 10, TypeScript 6, jsdom 26.
      # Ignore the next majors until a dedicated migration PR.
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitest/coverage-v8'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'jsdom'
        update-types:
          - 'version-update:semver-major'
      # Playwright 1.63.0 ships Chromium 153. The browser stops with a crash
      # when the app restores a disk handle after a reload. Keep 1.62.1 until
      # the browser fix is available.
      - dependency-name: '@playwright/test'
        versions:
          - '1.63.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
