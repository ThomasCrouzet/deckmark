name: Bug report
description: Report a reproducible bug
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Complete this form to help us reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is not working as expected?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        List the steps that reproduce the bug.
      placeholder: |
        1. Open DeckMark
        2. Create a new file
        3. Paste the following content
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DeckMark version and edition
      description: 'Find them in Settings > About. Example: 2.4.0, Web Light.'
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: 'Operating system and browser or native WebView. Example: Windows 11, WebView2.'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: 'Chrome 125, Firefox 126, Safari 17.4...'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: 'macOS 14, Windows 11, Ubuntu 24.04...'
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / deployment URL
      description: 'For the deployed site, copy the URL. For a local test, copy the commit hash (`git rev-parse HEAD`).'

  - type: textarea
    id: console
    attributes:
      label: Local diagnostics report (optional)
      description: |
        Settings > Report a problem builds the report locally. Review it and attach
        the downloaded JSON only if you choose to share it. Do not include API keys,
        document text or private paths.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: The bug is reproducible after a hard refresh (Cmd/Ctrl+Shift+R).
          required: true
