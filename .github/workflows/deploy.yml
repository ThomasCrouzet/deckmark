name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Use one concurrency group per ref. A global pages group combines main and all pull requests.
# Cancel obsolete pull request runs. Let a main deployment finish once it starts.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Use Node.js 24 for JavaScript actions before the required transition.
# actions/cache@v4 otherwise uses Node 20, which GitHub deprecated in June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  pages-config:
    # Read the real Pages configuration before the build.
    # A custom domain serves from the root. A project site serves from /<repository>.
    # A pull request does not read the Pages API, so it checks the project-site path.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      production_base_path: ${{ steps.paths.outputs.production_base_path }}
      check_base_path: ${{ steps.paths.outputs.check_base_path }}
    steps:
      - name: Read Pages settings
        id: pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Select build paths
        id: paths
        shell: bash
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          project_path="/${REPOSITORY#*/}"
          if [ "$PAGES_OUTCOME" != 'success' ]; then
            production_path="$project_path"
          else
            production_path="$PAGES_BASE_PATH"
          fi
          if [ -z "$production_path" ]; then
            check_path="$project_path"
          else
            check_path=''
          fi
          echo "production_base_path=$production_path" >> "$GITHUB_OUTPUT"
          echo "check_base_path=$check_path" >> "$GITHUB_OUTPUT"

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Third-party notices
        run: npm run notices:check

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Isolated failure tests and diagnostic coverage
        run: npm run test:coverage

  check:
    # Keep the required check name after the fast checks run in parallel.
    needs: [typecheck, lint, unit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the fast correctness tier
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          test "$TYPECHECK_RESULT" = 'success'
          test "$LINT_RESULT" = 'success'
          test "$UNIT_RESULT" = 'success'

  e2e-build:
    # Build one instrumented app for every browser shard. Each shard verifies
    # this artifact against its source and inputs before it starts the preview
    # server. The source-fidelity instrumentation is a distinct build input.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build instrumented app
        run: npm run build
        env:
          VITE_SOURCE_FIDELITY_METRICS: '1'
          BASE_PATH: ''

      - name: Record build provenance
        run: node scripts/build-provenance.mjs write --kind e2e --instrumentation source-fidelity

      - name: Upload test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build-${{ github.sha }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e-config:
    # One source for the shard count. The matrix, both denominators, the list
    # loop and the partition check read these outputs.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.config.outputs.shards }}
      count: ${{ steps.config.outputs.count }}
    steps:
      - name: Define the shard count
        id: config
        run: |
          echo 'shards=[1,2,3,4,5,6,7,8]' >> "$GITHUB_OUTPUT"
          echo 'count=8' >> "$GITHUB_OUTPUT"

  e2e-shard:
    # E2E uses one verified instrumented build. The shards still check out the
    # source, install dependencies and browsers, then verify the artifact.
    needs: [e2e-build, e2e-config]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-config.outputs.shards) }}
    # Each shard retains one worker and the complete browser project selection.
    # Eight shards reduce the critical path without increasing the worker count
    # on one runner. The shard check compares the local report with the expected
    # shard list. It prints executed, justified skip and retry counts. Reports
    # stay on the runner and are not uploaded.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Cache Playwright browsers in ~/.cache/ms-playwright to avoid repeated downloads (about 150 MB for Chromium and WebKit).
      # Use the lockfile in the cache key because it fixes the @playwright/test version.
      # On a cache hit, install only system dependencies through apt.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Configure Ubuntu APT
        run: bash .github/scripts/configure-ubuntu-apt.sh

      - name: Install Playwright browsers (+ system dependencies)
        if: steps.cache-pw.outputs.cache-hit != 'true'
        # The Ubuntu apt mirror can be slow on a shared runner.
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        timeout-minutes: 20
        run: npx playwright install-deps chromium firefox webkit

      - name: Download verified test build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build-${{ github.sha }}
          path: build/

      # Playwright verifies the provenance before it starts the preview server.
      # Visual snapshots: deliberately not a CI gate (local-only policy).
      # Docker Playwright baselines diverge from ubuntu-latest font rendering
      # (see CONTRIBUTING.md). Baselines stay versioned for local comparison;
      # do not remove --ignore-snapshots without regenerating on CI.
      - name: List the expected shard tests
        run: npx playwright test --list --ignore-snapshots --grep-invert "Snapshots visuels" --shard="$SHARD/$SHARD_COUNT" --reporter=json > "$RUNNER_TEMP/expected-shard.json"
        env:
          E2E_PREBUILT: '1'
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.e2e-config.outputs.count }}

      - name: E2E tests (without visual snapshots)
        run: xvfb-run -a npx playwright test --ignore-snapshots --grep-invert "Snapshots visuels" --shard="$SHARD/$SHARD_COUNT"
        env:
          E2E_PREBUILT: '1'
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.e2e-config.outputs.count }}

      - name: Check the shard manifest
        if: always()
        run: node scripts/check-e2e-manifest.mjs execution "$RUNNER_TEMP/expected-shard.json" test-results/results.json

  e2e-manifest:
    # Prove that the shard lists partition the full test list. Every list stays
    # on this runner. No report is uploaded or archived on GitHub. This job
    # proves the partition, not execution; each shard proves its own execution.
    needs: e2e-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: List the full test set and every shard
        env:
          E2E_PREBUILT: '1'
          SHARD_COUNT: ${{ needs.e2e-config.outputs.count }}
        run: |
          npx playwright test --list --ignore-snapshots --grep-invert "Snapshots visuels" --reporter=json > "$RUNNER_TEMP/all-tests.json"
          files=()
          for shard in $(seq 1 "$SHARD_COUNT"); do
            npx playwright test --list --ignore-snapshots --grep-invert "Snapshots visuels" --shard="$shard/$SHARD_COUNT" --reporter=json > "$RUNNER_TEMP/shard-$shard.json"
            files+=("$RUNNER_TEMP/shard-$shard.json")
          done
          node scripts/check-e2e-manifest.mjs partition "$SHARD_COUNT" "$RUNNER_TEMP/all-tests.json" "${files[@]}"

  e2e:
    needs: [e2e-build, e2e-shard, e2e-manifest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the verified build, every browser shard and the complete test partition
        env:
          BUILD_RESULT: ${{ needs.e2e-build.result }}
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
          MANIFEST_RESULT: ${{ needs.e2e-manifest.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$MANIFEST_RESULT" = success

  build:
    # The build starts as soon as the Pages paths are known. It does not wait
    # for type checks or the browser suite. The deploy job is the final gate.
    needs: [pages-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Build the production path and the other supported Web Light path.
      # GitHub Pages uses the production path. Cloudflare uses the root artifact.
      # Both builds use the same source revision and release gates.
      # A custom domain uses the root. A project site uses /<repository>.
      fail-fast: false
      matrix:
        include:
          - base_path: ${{ needs.pages-config.outputs.production_base_path }}
            upload: true
          - base_path: ${{ needs.pages-config.outputs.check_base_path }}
            upload: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.base_path }}

      - name: Check bundle size budget
        if: matrix.upload == true
        run: npm run size

      - name: Upload Pages artifact
        if: >-
          matrix.upload == true &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/

      - name: Upload root build for Lighthouse and Cloudflare
        if: matrix.base_path == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-build-${{ github.sha }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    # Lighthouse is a release gate on both pull requests and main.
    # The assertions and budgets are defined in the repository config files.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the empty-base artifact from this run and source revision.
      - name: Download root build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: root-build-${{ github.sha }}
          path: build/

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.github/lighthouserc.json
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: false
          temporaryPublicStorage: false

  deploy:
    # Publishing requires the fast checks, build, browser suite, and Lighthouse.
    needs: [check, build, e2e, lighthouse]
    # Do not deploy pull requests. Publish code only after merge.
    # Publish merged main code. A manual dispatch lets the drift check repair Pages
    # after a merge made with the workflow token.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job needs permission to publish to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  deploy-cloudflare:
    needs: [build, e2e, lighthouse, deploy]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://www.deckmark.dev/
    steps:
      - name: Require Cloudflare credentials
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish the mirror.'
            exit 1
          fi

      - name: Download the validated root build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: root-build-${{ github.sha }}
          path: build/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.157.0'
          command: pages deploy build --project-name=deckmark --branch=main --commit-hash=${{ github.sha }}

  verify-public:
    needs: [deploy, deploy-cloudflare]
    uses: ./.github/workflows/verify-deployment.yml
    with:
      source_sha: ${{ github.sha }}
