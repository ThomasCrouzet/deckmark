name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Use one concurrency group per ref. A global pages group combines main and all pull requests.
# Cancel obsolete pull request runs. Let a main deployment finish once it starts.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Use Node.js 24 for JavaScript actions before the required transition.
# actions/cache@v4 otherwise uses Node 20, which GitHub deprecated in June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Third-party notices
        run: npm run notices:check

      - name: Isolated failure tests and diagnostic coverage
        run: npm run test:coverage

  e2e-shard:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Each shard retains one worker and the complete browser project selection.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Cache Playwright browsers in ~/.cache/ms-playwright to avoid repeated downloads (about 150 MB for Chromium and WebKit).
      # Use the lockfile in the cache key because it fixes the @playwright/test version.
      # On a cache hit, install only system dependencies through apt.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Configure Ubuntu APT
        run: bash .github/scripts/configure-ubuntu-apt.sh

      - name: Install Playwright browsers (+ system dependencies)
        if: steps.cache-pw.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: npx playwright install-deps chromium firefox webkit

      # Visual snapshots: deliberately not a CI gate (local-only policy).
      # Docker Playwright baselines diverge from ubuntu-latest font rendering
      # (see CONTRIBUTING.md). Baselines stay versioned for local comparison;
      # do not remove --ignore-snapshots without regenerating on CI.
      - name: E2E tests (without visual snapshots)
        run: xvfb-run -a npx playwright test --ignore-snapshots --grep-invert "Snapshots visuels" --shard="$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}

  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$SHARD_RESULT" = success

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Build in parallel with an empty BASE_PATH for custom domains and /deckmark for GitHub Pages.
      # Only the /deckmark variant supplies the deployment artifact.
      # The empty variant detects incorrect absolute paths.
      fail-fast: false
      matrix:
        include:
          - base_path: /${{ github.event.repository.name }}
            upload: true
          - base_path: ''
            upload: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.base_path }}

      - name: Check bundle size budget
        if: matrix.upload == true
        run: npm run size

      - name: Upload artifact
        if: matrix.upload == true && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/

      - name: Upload root build for Lighthouse
        if: matrix.upload == false
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-build-${{ github.sha }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  lighthouse:
    # Lighthouse is a release gate on both pull requests and main.
    # The assertions and budgets are defined in the repository config files.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the empty-base artifact from this run and source revision.
      - name: Download root build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: root-build-${{ github.sha }}
          path: build/

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.github/lighthouserc.json
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: false
          temporaryPublicStorage: false

  deploy:
    # Publishing requires the build, browser suite, and Lighthouse audit.
    needs: [build, e2e, lighthouse]
    # Do not deploy pull requests. Publish code only after merge.
    # Publish merged main code. A manual dispatch lets the drift check repair Pages
    # after a merge made with the workflow token.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job needs permission to publish to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  deploy-cloudflare:
    # The custom domain serves the same build through Cloudflare Pages.
    # The github.io address stays native for networks that block newer domains.
    needs: [build, e2e, lighthouse, deploy]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the Cloudflare configuration
        id: config
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, the custom domain is not published."
          fi

      # The build job already produces the root variant for Lighthouse.
      - name: Download the root build
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: root-build-${{ github.sha }}
          path: build/

      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=deckmark --branch=main
