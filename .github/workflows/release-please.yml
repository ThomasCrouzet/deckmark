name: release-please

# Release creation runs inside the Desktop workflow, after the Desktop
# validation gate for the exact pushed commit. Dependency order replaces the
# previous runner that waited on another workflow run.
#
# This workflow keeps one manual entry point for release pull-request
# management. A push to main no longer starts a second release-please run, so
# two runs cannot race for one tag. The shared `release-please` concurrency
# group also serializes a manual run against the Desktop job.
#
# A manual run here creates or updates a source release only. Package a source
# tag with a Desktop `workflow_dispatch` run that sets `release_tag`.

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # Keep configuration in a separate file to change it without editing this workflow.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
