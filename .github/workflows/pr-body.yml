name: pr-body

# Check the release-please override block of a pull request body. A squash
# merge uses the body as the commit message, and release-please reads the
# BEGIN_COMMIT_OVERRIDE block of the merged pull request. See CONTRIBUTING.md.
#
# This workflow is separate from the validation workflows, so an `edited`
# event checks the new body without a second full CI run. It reads the body
# from an environment variable, never from the run script text. It installs
# no dependency. The fail-fast sentinel neither reads nor cancels this run.
# release-please pull requests carry their own generated body and are skipped.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the pull request commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Check the override block
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-pr-override.mjs check --base "$BASE_SHA" --head "$HEAD_SHA"
