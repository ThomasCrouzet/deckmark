name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Draft and ready transitions must rerun the tier decision. A draft run
    # defers the heavy matrix. A ready run must rerun the full matrix.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The changes job uses scripts/desktop-changes.mjs as the single path filter.
  # Rebuild weekly so an upstream toolchain change cannot rot the installers.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Source release tag used for the Desktop Beta
        required: false
        default: ''
        type: string
      packaging_only:
        description: Build and verify the four installers without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ inputs.release_tag || '' }}
  PACKAGING_ONLY: ${{ inputs.packaging_only || false }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.filter.outputs.required }}
      full: ${{ steps.tier.outputs.full }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Checkout change range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Desktop changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$RELEASE_TAG" ] || [ "$PACKAGING_ONLY" = 'true' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'pull_request' ]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/desktop-changes.mjs >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ] && [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ]; then
            git diff --name-only -z "$BEFORE_SHA" "$HEAD_SHA" | node scripts/desktop-changes.mjs >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Classify CI tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-tier.mjs --event-name "$EVENT_NAME" --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check the release coordinator policy
        # The publish path is driven by scripts/ci-release-coordinator.mjs. Its
        # routing, aggregate and CLI-deliverable checks run before the matrix,
        # so a broken release policy fails here and not at publication.
        run: node --test scripts/desktop-release-orchestration.test.mjs scripts/ci-release-coordinator.test.mjs

  resolve-source:
    needs: changes
    if: needs.changes.outputs.required == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Resolve and validate source identity
        id: source
        shell: bash
        run: |
          tag_sha=''
          if [ -n "$RELEASE_TAG" ]; then tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}"); fi
          node scripts/ci-release-coordinator.mjs source \
            --tag "$RELEASE_TAG" \
            --tag-sha "$tag_sha" \
            --sha "$(git rev-parse HEAD)" \
            --run-sha "$GITHUB_SHA" \
            --version "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")" \
            --output "$GITHUB_OUTPUT"

  validate-desktop:
    needs: [changes, resolve-source]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Configure Ubuntu APT
        if: runner.os == 'Linux'
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify GLib source and security backport
        run: node scripts/vendor-glib.mjs --check
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Test optimized GLib regression on Linux
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --test glib_variant_regression
      - name: Cache cargo-audit
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-audit
          key: cargo-audit-ubuntu24.04-${{ runner.arch }}-rust1.97.1-v0.22.2
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -x "$HOME/.cache/cargo-audit/bin/cargo-audit" ]; then
            "$HOME/.cache/cargo-audit/bin/cargo-audit" --version | grep -q '0.22.2'
          else
            cargo install cargo-audit --locked --version 0.22.2 --root "$HOME/.cache/cargo-audit"
          fi
      - name: Audit Cargo.lock including unsound dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: '"$HOME/.cache/cargo-audit/bin/cargo-audit" audit --file src-tauri/Cargo.lock --deny unsound'

  web-build:
    # One production Web build for every browser benchmark. The benchmark
    # verifies provenance before it serves these exact bytes. A root build is a
    # different configuration from the public project-path build.
    needs: [changes, resolve-source]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build production web app
        run: npm run build
        env:
          BASE_PATH: ''
      - name: Record build provenance
        run: node scripts/build-provenance.mjs write --kind web-benchmark --instrumentation none
      - name: Upload web benchmark build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ needs.resolve-source.outputs.sha }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  web-benchmark:
    # Web measurements depend on one verified frontend build. They do not wait
    # for Rust or native validation. The final desktop-validation gate still
    # requires every platform result.
    needs: [changes, resolve-source, web-build]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Configure Ubuntu APT
        # Prefer the archive mirror and bound each network wait. The azure mirror
        # took more than 20 minutes for the WebKit packages on run 42277784501.
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Playwright browser
        # Keep the reviewed limit. The mirror configuration above addresses the
        # slow download without raising the timeout.
        timeout-minutes: 20
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Download verified web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build-${{ needs.resolve-source.outputs.sha }}
          path: build/
      - name: Measure web benchmark
        run: node scripts/benchmark-local.mjs --browser ${{ matrix.browser }} --runs 5 --build-mode production-static --prebuilt --enforce-budgets --output "$RUNNER_TEMP/web-benchmark-${{ matrix.browser }}.json"

  native-validation:
    # One debug test application per OS. The job builds once, runs the smoke
    # cases, then measures the benchmark after every smoke process stops. The
    # sample counts, fixtures, budgets and failure propagation are unchanged.
    # A debug application never reaches a public installer.
    needs: [changes, resolve-source]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 55
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = 'arm64'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Ubuntu APT
        if: runner.os == 'Linux'
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Linux WebView and virtual display
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-daemon dbus-bin
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Rust cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Record native source before build
        run: node scripts/native-source.mjs native-test-results/source-before-build
      - name: Build isolated native test app
        run: npm run tauri -- build --debug --features native-smoke --no-bundle --config src-tauri/tauri.smoke.conf.json
        env:
          BASE_PATH: ''
      - name: Record native source after build
        if: always()
        run: node scripts/native-source.mjs native-test-results/source-after-build
      - name: Exercise actual Linux WebView
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/native-smoke.mjs
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: Exercise actual native WebView
        if: runner.os != 'Linux'
        run: node scripts/native-smoke.mjs
      - name: Measure Linux WebKitGTK benchmark
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- xvfb-run -a node scripts/benchmark-local.mjs --target native --build-mode debug --runs 5 --enforce-budgets --output "$RUNNER_TEMP/native-benchmark.json"
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: Measure native WebView benchmark
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/benchmark-local.mjs --target native --build-mode debug --runs 5 --enforce-budgets --output "$RUNNER_TEMP/native-benchmark.json"

  desktop-validation:
    name: desktop-validation
    needs: [changes, resolve-source, validate-desktop, web-build, web-benchmark, native-validation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check validation result
        # scripts/ci-release-coordinator.mjs owns the gate. It fails closed on a
        # failed classifier, a deferred tier, and any missing, skipped,
        # cancelled or failed matrix result.
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATION_REQUIRED: ${{ needs.changes.outputs.required }}
          FULL: ${{ needs.changes.outputs.full }}
          TIER: ${{ needs.changes.outputs.tier }}
          RESOLVE_RESULT: ${{ needs.resolve-source.result }}
          VALIDATE_RESULT: ${{ needs.validate-desktop.result }}
          NATIVE_RESULT: ${{ needs.native-validation.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          WEB_BENCHMARK_RESULT: ${{ needs.web-benchmark.result }}
        run: node scripts/ci-release-coordinator.mjs gate

  release-please:
    # Release creation runs here, after the Desktop validation gate for this
    # exact pushed commit. The previous separate workflow spent a runner that
    # polled this same run. Dependency order replaces that polling. A pull
    # request run cannot reach this job, so untrusted code never gets a write
    # token.
    needs: desktop-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.desktop-validation.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # A manual release-please run cannot overlap this one, so two runs cannot
    # race for the same tag.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout configuration and manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # Keep configuration in a separate file to change it without editing this workflow.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  plan-release:
    # One decision for the whole run. It reads the release result and the
    # validation gate, then states the source SHA and tag every later job must
    # use. It fails closed when a required result is missing or unsuccessful.
    needs: [changes, resolve-source, release-please, desktop-validation]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      packaging: ${{ steps.plan.outputs.packaging }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Plan the release
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_PLEASE_RESULT: ${{ needs.release-please.result }}
          VALIDATION_RESULT: ${{ needs.desktop-validation.result }}
          RESOLVE_RESULT: ${{ needs.resolve-source.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          # The push path reads the tag from release-please. The manual path
          # reads the tag from the dispatch input.
          tag_name="${RELEASE_TAG_NAME:-$RELEASE_TAG}"
          tag_sha=''
          if [ -n "$tag_name" ]; then tag_sha=$(git rev-parse "refs/tags/$tag_name^{commit}"); fi
          node scripts/ci-release-coordinator.mjs plan \
            --event-name "$EVENT_NAME" \
            --ref "$REF" \
            --release-created "$RELEASE_CREATED" \
            --tag-name "$RELEASE_TAG_NAME" \
            --input-tag "$RELEASE_TAG" \
            --packaging-only "$PACKAGING_ONLY" \
            --release-please-result "$RELEASE_PLEASE_RESULT" \
            --validation-result "$VALIDATION_RESULT" \
            --resolve-result "$RESOLVE_RESULT" \
            --changes-result "$CHANGES_RESULT" \
            --sha "$(git rev-parse HEAD)" \
            --run-sha "$GITHUB_SHA" \
            --tag-sha "$tag_sha" \
            --version "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")" \
            --output "$GITHUB_OUTPUT"

  build-desktop:
    # Three operating-system builds produce the four accepted installers.
    # The bundle selection is explicit for each runner. scripts/collect-desktop-assets.mjs
    # reads the same policy and refuses a missing, extra, misplaced or foreign artifact.
    needs: [plan-release]
    if: needs.plan-release.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            bundles: 'dmg'
            args: '--bundles dmg --target aarch64-apple-darwin'
          - platform: ubuntu-24.04
            bundles: 'deb,appimage'
            args: '--bundles deb,appimage'
          - platform: windows-2022
            bundles: 'nsis'
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-release.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Ubuntu APT
        if: runner.os == 'Linux'
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build workflow artifacts
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          BASE_PATH: ''
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: false

      - name: Select desktop installers
        id: installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo 'paths<<EOF'
            node --input-type=module <<'JS'
          import { basename } from 'node:path';
          import {
            DESKTOP_PLATFORM_BUNDLES,
            formatForFile,
            isInstallerName
          } from './scripts/desktop-release-policy.mjs';
          const platform = process.env.MATRIX_PLATFORM;
          const paths = JSON.parse(process.env.ARTIFACT_PATHS);
          const installers = paths.filter((path) => isInstallerName(basename(path)));
          if (installers.length === 0) throw new Error('No desktop installer was produced.');
          const produced = installers.map((path) => {
            const name = basename(path);
            const format = formatForFile(name);
            if (format.platform !== platform) {
              throw new Error(`${name} belongs to ${format.platform}, not ${platform}`);
            }
            return format.bundle;
          });
          if (new Set(produced).size !== produced.length) {
            throw new Error(`Duplicate installer bundle on ${platform}: ${produced.join(', ')}`);
          }
          const expected = DESKTOP_PLATFORM_BUNDLES[platform];
          const missing = expected.filter((bundle) => !produced.includes(bundle));
          if (missing.length) {
            throw new Error(`Missing bundle for ${platform}: ${missing.join(', ')}`);
          }
          process.stdout.write(`${installers.join('\n')}\n`);
          JS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Record installer source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.plan-release.outputs.sha }}
          SOURCE_TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          // A packaging-only run has no source tag yet. It records the tag the
          // release would use, so the collector applies the same policy.
          const tag = process.env.SOURCE_TAG || `v${version}`;
          writeFileSync('desktop-source.json', JSON.stringify({ sha: process.env.SOURCE_SHA, tag, version }, null, 2));
          JS

      - name: Upload desktop installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: |
            ${{ steps.installers.outputs.paths }}
            desktop-source.json
          if-no-files-found: error
          retention-days: 1

  verify-packaging:
    # Nonpublishing check for a release packaging change. It applies the same
    # collector policy and checksum verification as publication, and it creates
    # no tag, no release and no attestation.
    needs: [plan-release, build-desktop]
    if: needs.plan-release.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-release.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-installers-*
          path: downloaded-assets
          merge-multiple: false
      - name: Resolve the expected release tag
        id: tag
        run: echo "tag=v$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")" >> "$GITHUB_OUTPUT"
      - name: Collect and verify the four installers
        env:
          SOURCE_SHA: ${{ needs.plan-release.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/collect-desktop-assets.mjs downloaded-assets release-assets
      - name: Verify checksums from the release directory
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Render the Beta download table without publishing
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan-release.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/desktop-release-orchestration.mjs notes \
            --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --repository "$GH_REPO" \
            --sums release-assets/SHA256SUMS --output desktop-beta-notes.md
          cat release-assets/SHA256SUMS
          cat desktop-beta-notes.md

  publish-desktop-beta:
    needs: [plan-release, build-desktop]
    if: needs.plan-release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-release.outputs.sha }}
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-installers-*
          path: downloaded-assets
          merge-multiple: false
      - name: Select installers and verify source before checksums
        env:
          SOURCE_SHA: ${{ needs.plan-release.outputs.sha }}
          SOURCE_TAG: ${{ needs.plan-release.outputs.tag }}
        run: node scripts/collect-desktop-assets.mjs downloaded-assets release-assets
      - name: Verify checksums from the release directory
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Render the Desktop Beta notes
        env:
          SOURCE_TAG: ${{ needs.plan-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan-release.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/desktop-release-orchestration.mjs notes \
            --tag "$SOURCE_TAG" --sha "$SOURCE_SHA" --repository "$GH_REPO" \
            --sums release-assets/SHA256SUMS --output desktop-beta-notes.md
      - name: Publish distinct Desktop Beta release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ needs.plan-release.outputs.tag }}
          DESKTOP_TAG: desktop-${{ needs.plan-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan-release.outputs.sha }}
        run: |
          tag_sha=$(gh api "repos/$GH_REPO/commits/$SOURCE_TAG" --jq '.sha')
          gh api "repos/$GH_REPO/git/ref/tags/$SOURCE_TAG" >/dev/null
          gh api "repos/$GH_REPO/releases/tags/$SOURCE_TAG" > source-release.json
          node scripts/desktop-release-orchestration.mjs verify-source \
            --release source-release.json --tag "$SOURCE_TAG" --sha "$SOURCE_SHA" --tag-sha "$tag_sha"
          if gh release view "$DESKTOP_TAG" >/dev/null 2>&1; then
            gh release view "$DESKTOP_TAG" --json tagName,assets,isPrerelease,targetCommitish > existing-release.json
            test "$(jq -r '.isPrerelease' existing-release.json)" = 'true'
            release_target=$(jq -r '.targetCommitish' existing-release.json)
            release_target_sha=$(gh api "repos/$GH_REPO/commits/$release_target" --jq '.sha')
            test "$release_target_sha" = "$SOURCE_SHA"
            node scripts/desktop-release-orchestration.mjs plan-upload \
              --release existing-release.json --sums release-assets/SHA256SUMS \
              --tag "$DESKTOP_TAG" --output upload.txt
          else
            gh release create "$DESKTOP_TAG" \
              --target "$SOURCE_SHA" \
              --title "DeckMark editor Desktop Beta $SOURCE_TAG" \
              --notes-file desktop-beta-notes.md \
              --prerelease
            node scripts/desktop-release-orchestration.mjs plan-upload \
              --sums release-assets/SHA256SUMS --tag "$DESKTOP_TAG" --output upload.txt
          fi
          desktop_tag_sha=$(gh api "repos/$GH_REPO/commits/$DESKTOP_TAG" --jq '.sha')
          test "$desktop_tag_sha" = "$SOURCE_SHA"
          while IFS= read -r name; do
            case "$name" in
              '') continue ;;
              *.msi|*.rpm) echo "Refusing a removed installer format: $name" >&2; exit 1 ;;
            esac
            gh release upload "$DESKTOP_TAG" "release-assets/$name" --clobber
          done < upload.txt

  cli-package:
    # The reusable CLI workflow uploads its three standalone archives only for
    # this callable path. The call runs once, in the release run, for the same
    # commit the plan job approved. No later stage rebuilds a CLI archive.
    needs: plan-release
    if: needs.plan-release.outputs.publish == 'true'
    uses: ./.github/workflows/cli-package.yml
    permissions:
      contents: read

  cli-verify:
    # Check the exact-source CLI archives this run built against the explicit
    # allowlist in scripts/ci-release-coordinator.mjs. The archives stay run
    # artifacts: attaching them to a release is a separate distribution
    # decision. The Desktop installer collector never reads these files and
    # keeps its four-format assertion.
    needs: [plan-release, cli-package]
    if: needs.plan-release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-release.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Download the CLI build deliverables of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deckmark-cli-${{ needs.plan-release.outputs.sha }}-*
          path: downloaded-cli
          merge-multiple: false
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the CLI archives and record their checksums
        run: |
          node scripts/ci-release-coordinator.mjs verify-cli \
            --dir downloaded-cli \
            --sha "${{ needs.plan-release.outputs.sha }}" \
            --version "$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")" \
            --report "$RUNNER_TEMP/cli-deliverables.json"
          cat "$RUNNER_TEMP/cli-deliverables.json"
