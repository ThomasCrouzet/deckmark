name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Draft and ready transitions must rerun the tier decision. A draft run
    # defers the heavy matrix. A ready run must rerun the full matrix.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The changes job uses scripts/desktop-changes.mjs as the single path filter.
  # Rebuild weekly so an upstream toolchain change cannot rot the installers.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Source release tag used for the Desktop Beta
        required: false
        default: ''
        type: string
      packaging_only:
        description: Build and verify the four installers without publishing
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: Source release tag used for the Desktop Beta
        required: true
        type: string
      validation_run_id:
        description: Successful Desktop push run reused for this release
        required: false
        default: ''
        type: string
      validated_sha:
        description: Commit SHA validated by the reused Desktop push run
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ inputs.release_tag || '' }}
  VALIDATED_SHA: ${{ inputs.validated_sha || '' }}
  VALIDATION_RUN_ID: ${{ inputs.validation_run_id || '' }}
  PACKAGING_ONLY: ${{ inputs.packaging_only || false }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.filter.outputs.required }}
      full: ${{ steps.tier.outputs.full }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Checkout change range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Desktop changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$RELEASE_TAG" ] || [ "$PACKAGING_ONLY" = 'true' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'pull_request' ]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/desktop-changes.mjs >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ] && [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ]; then
            git diff --name-only -z "$BEFORE_SHA" "$HEAD_SHA" | node scripts/desktop-changes.mjs >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Classify CI tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-tier.mjs --event-name "$EVENT_NAME" --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  resolve-source:
    needs: changes
    if: needs.changes.outputs.required == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Resolve and validate source identity
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          const validatedSha = process.env.VALIDATED_SHA;
          const validationRunId = process.env.VALIDATION_RUN_ID;
          if (Boolean(validatedSha) !== Boolean(validationRunId)) {
            throw new Error('validated_sha and validation_run_id must be supplied together');
          }
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (tag && tag !== `v${version}`) throw new Error('Source tag/version mismatch');
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (tag) {
            if (!/^v\d+\.\d+\.\d+(?:-[\w.]+)?$/.test(tag)) throw new Error('Invalid release tag');
            execFileSync('git', ['show-ref', '--verify', '--quiet', `refs/tags/${tag}`]);
            const tagSha = execFileSync('git', ['rev-parse', `${tag}^{commit}`], { encoding: 'utf8' }).trim();
            if (tagSha !== sha) throw new Error('Release tag does not identify checked out source');
            if (process.env.GITHUB_SHA !== sha) throw new Error('Run the release workflow from the source tag so provenance identifies the same commit');
          }
          if (validatedSha) {
            if (validatedSha !== sha) throw new Error('Reused Desktop validation has a different source SHA');
            const run = JSON.parse(execFileSync('gh', [
              'api',
              `repos/${process.env.GH_REPO}/actions/runs/${validationRunId}`
            ], { encoding: 'utf8' }));
            if (run.head_sha !== sha || run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Reused Desktop validation is not a successful push run for this source SHA');
            }
            if (run.path !== '.github/workflows/desktop.yml') {
              throw new Error('Reused validation did not run the Desktop workflow');
            }
            const jobs = JSON.parse(execFileSync('gh', [
              'api',
              `repos/${process.env.GH_REPO}/actions/runs/${validationRunId}/jobs?per_page=100`
            ], { encoding: 'utf8' })).jobs;
            // Keep these platforms and job groups equal to the matrices below.
            const platforms = ['ubuntu-24.04', 'windows-2022', 'macos-15'];
            for (const group of ['validate-desktop', 'native-validation']) {
              const expected = platforms.map((platform) => `${group} (${platform})`);
              const matching = jobs.filter((job) => job.name.startsWith(`${group} (`));
              if (matching.length !== expected.length || expected.some((name) => {
                const entries = matching.filter((job) => job.name === name);
                return entries.length !== 1 || entries[0].status !== 'completed' || entries[0].conclusion !== 'success';
              })) {
                throw new Error(`Reused validation requires one successful completed ${group} job for each platform: ${platforms.join(', ')}`);
              }
            }
            const webBrowsers = ['chromium', 'firefox', 'webkit'];
            const webJobs = jobs.filter((job) => job.name.startsWith('web-benchmark ('));
            if (
              webJobs.length !== webBrowsers.length ||
              webBrowsers.some((browser) => {
                const entries = webJobs.filter((job) => job.name === `web-benchmark (${browser})`);
                return entries.length !== 1 || entries[0].status !== 'completed' || entries[0].conclusion !== 'success';
              })
            ) {
              throw new Error(`Reused validation requires one successful web-benchmark job for each browser: ${webBrowsers.join(', ')}`);
            }
            const gates = jobs.filter((job) => job.name === 'desktop-validation');
            if (gates.length !== 1 || gates[0].status !== 'completed' || gates[0].conclusion !== 'success') {
              throw new Error('Reused validation requires one successful completed desktop-validation gate');
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          JS

  validate-desktop:
    needs: [changes, resolve-source]
    if: inputs.validated_sha == '' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Configure Ubuntu APT
        if: runner.os == 'Linux'
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify GLib source and security backport
        run: node scripts/vendor-glib.mjs --check
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Test optimized GLib regression on Linux
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --test glib_variant_regression
      - name: Cache cargo-audit
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-audit
          key: cargo-audit-ubuntu24.04-${{ runner.arch }}-rust1.97.1-v0.22.2
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -x "$HOME/.cache/cargo-audit/bin/cargo-audit" ]; then
            "$HOME/.cache/cargo-audit/bin/cargo-audit" --version | grep -q '0.22.2'
          else
            cargo install cargo-audit --locked --version 0.22.2 --root "$HOME/.cache/cargo-audit"
          fi
      - name: Audit Cargo.lock including unsound dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: '"$HOME/.cache/cargo-audit/bin/cargo-audit" audit --file src-tauri/Cargo.lock --deny unsound'

  web-build:
    # One production Web build for every browser benchmark. The benchmark
    # verifies provenance before it serves these exact bytes. A root build is a
    # different configuration from the public project-path build.
    needs: [changes, resolve-source]
    if: inputs.validated_sha == '' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build production web app
        run: npm run build
        env:
          BASE_PATH: ''
      - name: Record build provenance
        run: node scripts/build-provenance.mjs write --kind web-benchmark --instrumentation none
      - name: Upload web benchmark build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ needs.resolve-source.outputs.sha }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  web-benchmark:
    # Web measurements depend on one verified frontend build. They do not wait
    # for Rust or native validation. The final desktop-validation gate still
    # requires every platform result.
    needs: [changes, resolve-source, web-build]
    if: inputs.validated_sha == '' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Configure Ubuntu APT
        # Prefer the archive mirror and bound each network wait. The azure mirror
        # took more than 20 minutes for the WebKit packages on run 42277784501.
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Playwright browser
        # Keep the reviewed limit. The mirror configuration above addresses the
        # slow download without raising the timeout.
        timeout-minutes: 20
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Download verified web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build-${{ needs.resolve-source.outputs.sha }}
          path: build/
      - name: Measure web benchmark
        run: node scripts/benchmark-local.mjs --browser ${{ matrix.browser }} --runs 5 --build-mode production-static --prebuilt --enforce-budgets --output "$RUNNER_TEMP/web-benchmark-${{ matrix.browser }}.json"

  native-validation:
    # One debug test application per OS. The job builds once, runs the smoke
    # cases, then measures the benchmark after every smoke process stops. The
    # sample counts, fixtures, budgets and failure propagation are unchanged.
    # A debug application never reaches a public installer.
    needs: [changes, resolve-source]
    if: inputs.validated_sha == '' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 55
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = 'arm64'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Ubuntu APT
        if: runner.os == 'Linux'
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Linux WebView and virtual display
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-daemon dbus-bin
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Rust cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Record native source before build
        run: node scripts/native-source.mjs native-test-results/source-before-build
      - name: Build isolated native test app
        run: npm run tauri -- build --debug --features native-smoke --no-bundle --config src-tauri/tauri.smoke.conf.json
        env:
          BASE_PATH: ''
      - name: Record native source after build
        if: always()
        run: node scripts/native-source.mjs native-test-results/source-after-build
      - name: Exercise actual Linux WebView
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/native-smoke.mjs
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: Exercise actual native WebView
        if: runner.os != 'Linux'
        run: node scripts/native-smoke.mjs
      - name: Measure Linux WebKitGTK benchmark
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- xvfb-run -a node scripts/benchmark-local.mjs --target native --build-mode debug --runs 5 --enforce-budgets --output "$RUNNER_TEMP/native-benchmark.json"
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: Measure native WebView benchmark
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/benchmark-local.mjs --target native --build-mode debug --runs 5 --enforce-budgets --output "$RUNNER_TEMP/native-benchmark.json"

  desktop-validation:
    name: desktop-validation
    needs: [changes, resolve-source, validate-desktop, web-build, web-benchmark, native-validation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check validation result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATION_REQUIRED: ${{ needs.changes.outputs.required }}
          FULL: ${{ needs.changes.outputs.full }}
          TIER: ${{ needs.changes.outputs.tier }}
          RESOLVE_RESULT: ${{ needs.resolve-source.result }}
          VALIDATE_RESULT: ${{ needs.validate-desktop.result }}
          SMOKE_RESULT: ${{ needs.native-validation.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          WEB_BENCHMARK_RESULT: ${{ needs.web-benchmark.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo 'Desktop change detection failed.' >&2
            exit 1
          fi
          if [ "$VALIDATION_REQUIRED" != 'true' ]; then
            echo 'Desktop validation is not required for these paths.'
          elif [ "$FULL" != 'true' ] || [ "$TIER" != 'full' ]; then
            echo "Desktop validation tier is '$TIER' (full='$FULL')." >&2
            echo 'Draft runs defer the native and benchmark matrix. This check is incomplete and is not a pass.' >&2
            echo 'Mark the pull request ready for review to run the full matrix on the exact HEAD.' >&2
            exit 1
          elif [ -n "$VALIDATED_SHA" ]; then
            test "$RESOLVE_RESULT" = 'success'
            test "$VALIDATE_RESULT" = 'skipped'
            test "$WEB_BUILD_RESULT" = 'skipped'
            test "$WEB_BENCHMARK_RESULT" = 'skipped'
            test "$SMOKE_RESULT" = 'skipped'
            echo "Reused Desktop validation run $VALIDATION_RUN_ID for $VALIDATED_SHA."
          else
            test "$RESOLVE_RESULT" = 'success'
            test "$VALIDATE_RESULT" = 'success'
            test "$WEB_BUILD_RESULT" = 'success'
            test "$WEB_BENCHMARK_RESULT" = 'success'
            test "$SMOKE_RESULT" = 'success'
          fi

  build-desktop:
    # Three operating-system builds produce the four accepted installers.
    # The bundle selection is explicit for each runner. scripts/collect-desktop-assets.mjs
    # reads the same policy and refuses a missing, extra, misplaced or foreign artifact.
    needs: [resolve-source, desktop-validation]
    if: ${{ !cancelled() && (inputs.release_tag != '' || inputs.packaging_only == 'true') && needs.resolve-source.result == 'success' && needs.desktop-validation.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            bundles: 'dmg'
            args: '--bundles dmg --target aarch64-apple-darwin'
          - platform: ubuntu-24.04
            bundles: 'deb,appimage'
            args: '--bundles deb,appimage'
          - platform: windows-2022
            bundles: 'nsis'
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Configure Ubuntu APT
        if: runner.os == 'Linux'
        run: bash .github/scripts/configure-ubuntu-apt.sh
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build workflow artifacts
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          BASE_PATH: ''
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: false

      - name: Select desktop installers
        id: installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo 'paths<<EOF'
            node --input-type=module <<'JS'
          import { basename } from 'node:path';
          import {
            DESKTOP_PLATFORM_BUNDLES,
            formatForFile,
            isInstallerName
          } from './scripts/desktop-release-policy.mjs';
          const platform = process.env.MATRIX_PLATFORM;
          const paths = JSON.parse(process.env.ARTIFACT_PATHS);
          const installers = paths.filter((path) => isInstallerName(basename(path)));
          if (installers.length === 0) throw new Error('No desktop installer was produced.');
          const produced = installers.map((path) => {
            const name = basename(path);
            const format = formatForFile(name);
            if (format.platform !== platform) {
              throw new Error(`${name} belongs to ${format.platform}, not ${platform}`);
            }
            return format.bundle;
          });
          if (new Set(produced).size !== produced.length) {
            throw new Error(`Duplicate installer bundle on ${platform}: ${produced.join(', ')}`);
          }
          const expected = DESKTOP_PLATFORM_BUNDLES[platform];
          const missing = expected.filter((bundle) => !produced.includes(bundle));
          if (missing.length) {
            throw new Error(`Missing bundle for ${platform}: ${missing.join(', ')}`);
          }
          process.stdout.write(`${installers.join('\n')}\n`);
          JS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Record installer source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          // A packaging-only run has no source tag yet. It records the tag the
          // release would use, so the collector applies the same policy.
          const tag = process.env.RELEASE_TAG || `v${version}`;
          writeFileSync('desktop-source.json', JSON.stringify({ sha: process.env.SOURCE_SHA, tag, version }, null, 2));
          JS

      - name: Upload desktop installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: |
            ${{ steps.installers.outputs.paths }}
            desktop-source.json
          if-no-files-found: error
          retention-days: 1

  verify-packaging:
    # Nonpublishing check for a release packaging change. It applies the same
    # collector policy and checksum verification as publication, and it creates
    # no tag, no release and no attestation.
    needs: [resolve-source, build-desktop]
    if: ${{ !cancelled() && inputs.packaging_only == 'true' && needs.resolve-source.result == 'success' && needs.build-desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-installers-*
          path: downloaded-assets
          merge-multiple: false
      - name: Resolve the expected release tag
        id: tag
        run: echo "tag=v$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")" >> "$GITHUB_OUTPUT"
      - name: Collect and verify the four installers
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/collect-desktop-assets.mjs downloaded-assets release-assets
      - name: Verify checksums from the release directory
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Render the Beta download table without publishing
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/desktop-release-orchestration.mjs notes \
            --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --repository "$GH_REPO" \
            --sums release-assets/SHA256SUMS --output desktop-beta-notes.md
          cat release-assets/SHA256SUMS
          cat desktop-beta-notes.md

  publish-desktop-beta:
    needs: [resolve-source, build-desktop]
    if: ${{ !cancelled() && inputs.release_tag != '' && inputs.packaging_only != 'true' && needs.resolve-source.result == 'success' && needs.build-desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-installers-*
          path: downloaded-assets
          merge-multiple: false
      - name: Select installers and verify source before checksums
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/collect-desktop-assets.mjs downloaded-assets release-assets
      - name: Verify checksums from the release directory
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Render the Desktop Beta notes
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/desktop-release-orchestration.mjs notes \
            --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --repository "$GH_REPO" \
            --sums release-assets/SHA256SUMS --output desktop-beta-notes.md
      - name: Publish distinct Desktop Beta release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ env.RELEASE_TAG }}
          DESKTOP_TAG: desktop-${{ env.RELEASE_TAG }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          tag_sha=$(gh api "repos/$GH_REPO/commits/$SOURCE_TAG" --jq '.sha')
          gh api "repos/$GH_REPO/git/ref/tags/$SOURCE_TAG" >/dev/null
          gh api "repos/$GH_REPO/releases/tags/$SOURCE_TAG" > source-release.json
          node scripts/desktop-release-orchestration.mjs verify-source \
            --release source-release.json --tag "$SOURCE_TAG" --sha "$SOURCE_SHA" --tag-sha "$tag_sha"
          if gh release view "$DESKTOP_TAG" >/dev/null 2>&1; then
            gh release view "$DESKTOP_TAG" --json tagName,assets,isPrerelease,targetCommitish > existing-release.json
            test "$(jq -r '.isPrerelease' existing-release.json)" = 'true'
            release_target=$(jq -r '.targetCommitish' existing-release.json)
            release_target_sha=$(gh api "repos/$GH_REPO/commits/$release_target" --jq '.sha')
            test "$release_target_sha" = "$SOURCE_SHA"
            node scripts/desktop-release-orchestration.mjs plan-upload \
              --release existing-release.json --sums release-assets/SHA256SUMS \
              --tag "$DESKTOP_TAG" --output upload.txt
          else
            gh release create "$DESKTOP_TAG" \
              --target "$SOURCE_SHA" \
              --title "DeckMark editor Desktop Beta $SOURCE_TAG" \
              --notes-file desktop-beta-notes.md \
              --prerelease
            node scripts/desktop-release-orchestration.mjs plan-upload \
              --sums release-assets/SHA256SUMS --tag "$DESKTOP_TAG" --output upload.txt
          fi
          desktop_tag_sha=$(gh api "repos/$GH_REPO/commits/$DESKTOP_TAG" --jq '.sha')
          test "$desktop_tag_sha" = "$SOURCE_SHA"
          while IFS= read -r name; do
            case "$name" in
              '') continue ;;
              *.msi|*.rpm) echo "Refusing a removed installer format: $name" >&2; exit 1 ;;
            esac
            gh release upload "$DESKTOP_TAG" "release-assets/$name" --clobber
          done < upload.txt
