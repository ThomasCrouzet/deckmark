name: Deployment drift

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-drift
  cancel-in-progress: false

jobs:
  main-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Resolve main
        id: main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  verify-public:
    needs: main-head
    uses: ./.github/workflows/verify-deployment.yml
    with:
      source_sha: ${{ needs.main-head.outputs.sha }}

  repair:
    needs: [main-head, verify-public]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.main-head.result == 'success' && needs.verify-public.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Request a gated deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy.yml --ref main
          echo '::error::Public verification failed. A gated deployment was requested. Check its public verification result to confirm repair.'
          exit 1
