name: Cloudflare settings audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read project and analytics settings
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/deckmark" \
            | jq '{success, errors, project: (.result | {name, subdomain, domains, production_branch, analytics_configured: (.build_config | {tag: ((.web_analytics_tag // "") != ""), token: ((.web_analytics_token // "") != "")}), deployment: (.canonical_deployment | {id, url})})}'
          curl --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/rum/site_info/list" \
            | jq '{success, errors, sites: [.result[]? | {site_tag, host, auto_install, enabled, ruleset} ]}'
