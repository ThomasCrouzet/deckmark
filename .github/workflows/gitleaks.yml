name: gitleaks

# Scan Git history for secrets with the pinned official Docker image.
# Add specific false-positive exclusions to .gitleaks.toml in the repository root.
#
# Push events scan only the pushed range when the before and head commits are
# reachable and ordered. A new branch, force push, or malformed value scans the
# complete history. The weekly schedule and a manual run also scan the complete
# history, so the baseline is never lost. A pull request scans base..head when
# both commits exist and share history. The base commit is the base branch tip
# at event time, so it often does not contain the head commit; git still
# accepts the range, and the range holds the pull request commits only. A
# missing, malformed, or unrelated pair fails closed. The workflow uses no
# secret and no credential, so a fork pull request is safe.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          log_opts=$(bash scripts/ci-security-gitleaks-range.sh \
            --event "$EVENT_NAME" \
            --before "$BEFORE_SHA" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA")
          printf 'log_opts=%s\n' "$log_opts" >> "$GITHUB_OUTPUT"

      - name: gitleaks (pinned image)
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          args=(git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1)
          if [ -n "$LOG_OPTS" ]; then
            args+=(--log-opts "$LOG_OPTS")
          fi
          # ghcr.io/gitleaks/gitleaks:v8.30.1
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            "${args[@]}"
