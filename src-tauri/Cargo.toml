[package]
name = "deckmark"
# The application version comes from ../package.json through tauri.conf.json.
version = "0.0.0"
description = "Local-first offline WYSIWYG markdown editor"
authors = ["Thomas Crouzet"]
license = "MIT"
repository = "https://github.com/ThomasCrouzet/deckmark"
edition = "2021"
rust-version = "1.88"

[lib]
name = "deckmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[features]
native-smoke = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
sha2 = "0.11"
base64 = "0.23"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
# Native AI request boundary. The crypto provider is installed by ai.rs.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSApplication", "NSButton", "NSEvent", "NSMenu", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSURL", "NSGeometry"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"

[patch.crates-io]
glib = { path = "vendor/glib" }
