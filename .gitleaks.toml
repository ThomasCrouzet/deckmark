# Extend the default gitleaks rules.
#
# Add specific allowlists (paths, regexes, or stopwords) for false positives.
# These can include test secrets, fixtures, or documentation examples.
# There are no known false positives.
[extend]
useDefault = true

# The AI provider tests use this literal as a rejected fake key. It has no
# value outside the test fixture and is not a real credential.
[[allowlists]]
description = "Synthetic key literal in the AI provider test fixtures."
regexes = ['''sk-live-SECRET1234567890''']
